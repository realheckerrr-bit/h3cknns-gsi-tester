name: Cuttlefish GSI boot smoke test

on:
  workflow_dispatch:
    inputs:
      cuttlefish_build_id:
        description: 'AOSP CI build ID for aosp_cf_arm64_only_phone'
        required: true
        default: '14981173'
      cuttlefish_target:
        description: 'Exact AOSP CI target containing the image artifact'
        required: true
        default: 'aosp_cf_arm64_only_phone-userdebug'
      gsi_url:
        description: 'Official ARM64 GSI ZIP URL'
        required: true
        default: 'https://dl.google.com/developers/android/cinnamonbun/images/gsi/aosp_arm64-exp-CP41.260831.007-16416850-5e61c946.zip'
      gsi_sha256:
        description: 'SHA-256 for the GSI ZIP (empty disables the check)'
        required: false
        default: '5e61c946ee45680365336968827bf62509d90f66ed78938f88e4deedda40a7fe'

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ARM QEMU and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils cpio lz4 qemu-system-arm unzip xz-utils

      - name: Install official Android virtio firmware
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            -o /tmp/efi-virtio.rom.b64 \
            'https://android.googlesource.com/platform/external/qemu/+/emu-35-3-release/pc-bios/efi-virtio.rom?format=TEXT'
          base64 --decode /tmp/efi-virtio.rom.b64 > /tmp/efi-virtio.rom
          test -s /tmp/efi-virtio.rom
          sudo install -m 0644 /tmp/efi-virtio.rom /usr/share/qemu/efi-virtio.rom

      - name: Download Cuttlefish ARM64 device image
        shell: bash
        env:
          BUILD_ID: ${{ inputs.cuttlefish_build_id }}
          TARGET: ${{ inputs.cuttlefish_target }}
        run: |
          set -euo pipefail
          mkdir -p cf-image
          viewer_url="https://ci.android.com/builds/submitted/${BUILD_ID}/${TARGET}/latest/aosp_cf_arm64_only_phone-img-${BUILD_ID}.zip"
          curl --fail --location --retry 3 --retry-delay 3 -o cf-image/viewer.html "$viewer_url"
          artifact_url=$(python3 - cf-image/viewer.html <<'PY'
          import json
          import re
          import sys

          html = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(r'"artifactUrl":"([^"]+)"', html)
          if not match:
              raise SystemExit("ci.android.com did not expose a signed artifact URL")
          print(json.loads('"' + match.group(1) + '"'))
          PY
          )
          curl --fail --location --retry 3 --retry-delay 3 \
            -o cf-image/cuttlefish.zip "$artifact_url"
          unzip -q cf-image/cuttlefish.zip -d cf-image/root

          host_viewer_url="https://ci.android.com/builds/submitted/${BUILD_ID}/${TARGET}/latest/cvd-host_package.tar.gz"
          curl --fail --location --retry 3 --retry-delay 3 \
            -o cf-image/host-viewer.html "$host_viewer_url"
          host_artifact_url=$(python3 - cf-image/host-viewer.html <<'PY'
          import json
          import re
          import sys

          html = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(r'"artifactUrl":"([^"]+)"', html)
          if not match:
              raise SystemExit("ci.android.com did not expose the Cuttlefish host package URL")
          print(json.loads('"' + match.group(1) + '"'))
          PY
          )
          curl --fail --location --retry 3 --retry-delay 3 \
            -o cf-image/cvd-host_package.tar.gz "$host_artifact_url"
          mkdir -p cf-image/host
          tar -xzf cf-image/cvd-host_package.tar.gz -C cf-image/host

      - name: Download and verify official ARM64 GSI
        shell: bash
        env:
          GSI_URL: ${{ inputs.gsi_url }}
          GSI_SHA256: ${{ inputs.gsi_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p gsi
          curl --fail --location --retry 3 --retry-delay 3 -o gsi/gsi.zip "$GSI_URL"
          if [[ -n "$GSI_SHA256" ]]; then
            echo "$GSI_SHA256  gsi/gsi.zip" | sha256sum --check --status
          fi
          unzip -q gsi/gsi.zip -d gsi/root
          if [[ -f gsi/root/system.img.gz ]]; then
            gzip -dc gsi/root/system.img.gz > gsi/system.img
          elif [[ -f gsi/root/system.img.xz ]]; then
            xz -dc gsi/root/system.img.xz > gsi/system.img
          elif [[ -f gsi/root/system.img ]]; then
            cp gsi/root/system.img gsi/system.img
          else
            echo 'The GSI ZIP has no system.img, system.img.gz, or system.img.xz.' >&2
            exit 1
          fi

      - name: Extract Cuttlefish boot and vendor partitions
        shell: bash
        run: |
          set -euo pipefail
          image_dir=cf-image/root
          boot_img=$(find "$image_dir" -type f -name boot.img -print -quit)
          super_img=$(find "$image_dir" -type f -name super.img -print -quit)
          userdata_img=$(find "$image_dir" -type f -name userdata.img -print -quit)
          [[ -n "$boot_img" && -n "$super_img" && -n "$userdata_img" ]]

          mkdir -p boot boot-init boot-vendor vendor
          echo 'Cuttlefish boot-related files:'
          find "$image_dir" -type f | grep -Ei '/(kernel|ramdisk|boot|init_boot|vendor_boot)' | head -80 || true
          direct_kernel=$(find "$image_dir" cf-image/host -type f \( -name kernel -o -name kernel-ranchu -o -name kernel_16k -o -name 'kernel-*' \) ! -name '*cmdline*' -print -quit)
          direct_ramdisk=$(find "$image_dir" -type f \( -name ramdisk.img -o -name ramdisk -o -name 'ramdisk-*' \) -print -quit)
          if [[ -n "$direct_kernel" ]]; then
            cp "$direct_kernel" boot/kernel
          fi
          python3 tools/unpack_android_boot_image.py "$boot_img" boot || true
          init_boot_img=$(find "$image_dir" -type f -name init_boot.img -print -quit)
          vendor_boot_img=$(find "$image_dir" -type f -name vendor_boot.img -print -quit)
          if [[ -n "$init_boot_img" ]]; then
            python3 tools/unpack_android_boot_image.py "$init_boot_img" boot-init || true
          fi
          if [[ -n "$vendor_boot_img" ]]; then
            python3 tools/unpack_android_boot_image.py "$vendor_boot_img" boot-vendor || true
          fi
          if [[ ! -f boot/kernel ]]; then
            direct_kernel=$(find cf-image/host "$image_dir" -type f \( -name kernel -o -name kernel-ranchu -o -name kernel_16k -o -name 'kernel-*' \) ! -name '*cmdline*' -print -quit)
            [[ -n "$direct_kernel" ]] && cp "$direct_kernel" boot/kernel
          fi
          if [[ ! -f boot/ramdisk && -n "$direct_ramdisk" ]]; then
            cp "$direct_ramdisk" boot/ramdisk
          fi
          if [[ ! -f boot/ramdisk && -f boot-init/ramdisk && -f boot-vendor/ramdisk ]]; then
            python3 tools/merge_android_ramdisks.py \
              boot-init/ramdisk boot-vendor/ramdisk boot/ramdisk
          fi
          if [[ ! -f boot/ramdisk ]]; then
            ramdisk=$(find boot boot-init boot-vendor -maxdepth 1 -type f -name ramdisk -print -quit)
            [[ -n "$ramdisk" ]] && cp "$ramdisk" boot/ramdisk
          fi
          [[ -f boot/kernel && -f boot/ramdisk ]]
          python3 tools/patch_ranchu_ramdisk.py boot/ramdisk boot/ramdisk.direct.img cuttlefish
          mv boot/ramdisk.direct.img boot/ramdisk
          rm -rf ramdisk-debug
          mkdir -p ramdisk-debug
          gzip -dc boot/ramdisk | (cd ramdisk-debug && cpio -idm --no-absolute-filenames >/dev/null 2>&1 || true)
          find ramdisk-debug -type f -iname 'fstab*' -print -exec sed -n '1,120p' {} \; || true
          file boot/kernel boot/ramdisk
          wc -c boot/kernel boot/ramdisk

          if simg2img "$super_img" cf-image/super.raw.img 2>/dev/null; then
            super_for_lpunpack=cf-image/super.raw.img
          else
            super_for_lpunpack="$super_img"
          fi
          python3 tools/list_super_partitions.py "$super_for_lpunpack"
          python3 tools/extract_logical_partition.py \
            "$super_for_lpunpack" vendor vendor/vendor.img \
            || python3 tools/extract_logical_partition.py \
            "$super_for_lpunpack" vendor_a vendor/vendor.img
          vendor_img=$(find vendor -maxdepth 1 -type f -name vendor.img -print -quit)
          [[ -n "$vendor_img" ]]
          stat -c 'userdata_source=%s' "$userdata_img"
          stat -c 'vendor_extracted=%s' "$vendor_img"
          if simg2img "$userdata_img" cf-image/userdata.raw.img 2>/dev/null; then
            cp cf-image/userdata.raw.img cf-image/userdata.img
          else
            cp "$userdata_img" cf-image/userdata.img
          fi
          stat -c 'userdata_qemu=%s' cf-image/userdata.img
          printf 'kernel=%s\nramdisk=%s\nvendor=%s\n' \
            boot/kernel boot/ramdisk "$vendor_img"

      - name: Run the app-equivalent headless QEMU boot
        shell: bash
        run: |
          set -uo pipefail
          vendor_img=$(find vendor -maxdepth 1 -type f \( -name vendor_a.img -o -name vendor.img \) -print -quit)
          qemu-system-aarch64 \
            -M virt,gic-version=2,mte=on,usb=off,dump-guest-core=off \
            -cpu max -m 2048 -smp 4 -rtc base=utc \
            -kernel boot/kernel -initrd boot/ramdisk \
            -append 'loop.max_part=7 init=/init console=ttyAMA0,115200 earlycon=pl011,mmio,0x09000000 androidboot.console=ttyAMA0 androidboot.hardware=vsoc androidboot.boot_devices=4010000000.pcie androidboot.slot_suffix=_a androidboot.verifiedbootstate=orange mac80211_hwsim.radios=0 androidboot.lcd_density=160 androidboot.setupwizard_mode=DISABLED security=selinux enforcing=0 androidboot.selinux=permissive audit=1 buildvariant=userdebug' \
            -drive if=none,format=raw,id=system,file=$PWD/gsi/system.img,readonly=on \
            -device virtio-blk-pci,romfile=efi-virtio.rom,scsi=off,drive=system \
            -drive if=none,format=raw,id=userdata,file=$PWD/cf-image/userdata.img \
            -device virtio-blk-pci,romfile=efi-virtio.rom,scsi=off,drive=userdata \
            -drive if=none,format=raw,id=vendor,file=$PWD/$vendor_img,readonly=on \
            -device virtio-blk-pci,romfile=efi-virtio.rom,scsi=off,drive=vendor \
            -device virtio-gpu-pci,id=gpu0 \
            -object rng-random,id=objrng0,filename=/dev/urandom \
            -device virtio-rng-pci,rng=objrng0,max-bytes=1024,period=2000 \
            -display none -monitor none -serial file:$PWD/serial.log -no-reboot \
            -d guest_errors,unimp -D "$PWD/qemu.debug" \
            > qemu.stdout 2> qemu.stderr &
          qemu_pid=$!
          booted=0
          for _ in $(seq 1 240); do
            if grep -Eiq "starting service 'zygote'|sys.boot_completed=1|AndroidRuntime" serial.log 2>/dev/null; then
              booted=1
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "$qemu_pid" 2>/dev/null; then
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
            qemu_status=0
          else
            wait "$qemu_pid" 2>/dev/null
            qemu_status=$?
          fi
          printf 'qemu=%s\nqemu_status=%s\n' "$(command -v qemu-system-aarch64 || true)" "$qemu_status"
          cat serial.log 2>/dev/null || true
          cat qemu.stdout 2>/dev/null || true
          cat qemu.stderr 2>/dev/null || true
          tail -200 qemu.debug 2>/dev/null || true
          if [[ "$booted" != 1 ]]; then
            echo 'No Android boot marker was observed in the serial log.' >&2
            exit 1
          fi

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuttlefish-gsi-boot-logs
          path: |
            serial.log
            qemu.stdout
            qemu.stderr
            qemu.debug
          if-no-files-found: ignore
