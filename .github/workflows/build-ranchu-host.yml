name: Build Ranchu host smoke-test QEMU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential flex gettext \
            cpio e2fsprogs lz4 unzip \
            libfdt-dev libglib2.0-dev libpixman-1-dev libslirp-dev \
            libtool ninja-build pkg-config python3 python3-lib2to3 rsync xz-utils

      - name: Build desktop Ranchu QEMU
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch ranchu \
            https://qemu-android.googlesource.com/qemu-android \
            ranchu-qemu
          git -C ranchu-qemu config submodule.dtc.url https://github.com/qemu/dtc.git
          git -C ranchu-qemu config submodule.pixman.url https://gitlab.freedesktop.org/pixman/pixman.git
          git -C ranchu-qemu submodule update --init --depth 1 dtc pixman
          sed -i \
            -e 's/sys.version_info < (2,4) or sys.version_info >= (3,)/sys.version_info < (2,4)/' \
            -e 's/sys.version_info < (2,6) or sys.version_info >= (3,)/sys.version_info < (2,6)/' \
            ranchu-qemu/configure
          python3 - "$PWD/ranchu-qemu/scripts/ordereddict.py" <<'PY'
          from pathlib import Path
          import sys

          Path(sys.argv[1]).write_text("from collections import OrderedDict\n")
          PY
          sed -i 's/android_console_redir_remove/android_console_redir_del/g' \
            ranchu-qemu/android-console.c
          # The Android ARM64 Image has text_offset=0. Modern QEMU shifts it
          # above the bootloader; this legacy loader uses a fixed offset.
          sed -i 's/#define KERNEL64_LOAD_ADDR 0x00080000/#define KERNEL64_LOAD_ADDR 0x00200000/' \
            ranchu-qemu/hw/arm/boot.c
          python3 -m lib2to3 -w -n \
            ranchu-qemu/scripts/qapi.py \
            ranchu-qemu/scripts/qapi-commands.py \
            ranchu-qemu/scripts/qapi-types.py \
            ranchu-qemu/scripts/qapi-visit.py \
            ranchu-qemu/scripts/tracetool.py \
            ranchu-qemu/scripts/tracetool >/dev/null
          cd ranchu-qemu
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-werror \
            --disable-sdl \
            --disable-gtk \
            --disable-vnc \
            --disable-curses \
            --disable-slirp \
            --enable-trace-backend=nop
          make -j2
          test -x aarch64-softmmu/qemu-system-aarch64
          aarch64-softmmu/qemu-system-aarch64 -machine help | grep -E '^ranchu '

      - name: Download Android Emulator Ranchu guest pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p guest
          curl --fail --location --retry 3 --retry-delay 3 \
            -o guest/emulator.zip \
            https://dl.google.com/android/repository/sys-img/google_apis/arm64-v8a-35_r08.zip
          entries=$(unzip -Z1 guest/emulator.zip)
          for asset in kernel-ranchu ramdisk.img; do
            entry=$(printf '%s\n' "$entries" | grep -E "(^|/)$asset$" | head -1 || true)
            [[ -n "$entry" ]]
            unzip -p guest/emulator.zip "$entry" > "guest/$asset"
            test -s "guest/$asset"
          done
          if gzip -t guest/kernel-ranchu 2>/dev/null; then
            gzip -dc guest/kernel-ranchu > guest/kernel-ranchu.raw
          else
            cp guest/kernel-ranchu guest/kernel-ranchu.raw
          fi
          test -s guest/kernel-ranchu.raw
          vendor_gz_entry=$(printf '%s\n' "$entries" | grep -E '(^|/)vendor\.img\.gz$' | head -1 || true)
          vendor_raw_entry=$(printf '%s\n' "$entries" | grep -E '(^|/)vendor\.img$' | head -1 || true)
          if [[ -n "$vendor_gz_entry" ]]; then
            unzip -p guest/emulator.zip "$vendor_gz_entry" | gzip -dc > guest/vendor.img
          else
            [[ -n "$vendor_raw_entry" ]]
            unzip -p guest/emulator.zip "$vendor_raw_entry" > guest/vendor.img
          fi
          test -s guest/vendor.img
          userdata_entry=$(printf '%s\n' "$entries" | grep -E '(^|/)userdata\.img$' | head -1 || true)
          if [[ -n "$userdata_entry" ]]; then
            unzip -p guest/emulator.zip "$userdata_entry" > guest/userdata.img
          else
            truncate -s 2G guest/userdata.img
            mkfs.ext4 -F -L userdata guest/userdata.img >/dev/null
          fi
          test -s guest/userdata.img

      - name: Download and verify Android 15 AOSP ARM64 GSI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            -o guest/gsi.zip \
            https://dl.google.com/developers/android/vic/images/gsi/aosp_arm64-exp-AP4A.241205.013-12621605-14e72a7c.zip
          echo '14e72a7c1b6b6600ba4f7b6057c79e531bbb9aa763e9e998ab5e1a8709e5075b  guest/gsi.zip' | sha256sum --check --status
          system_entry=$(unzip -Z1 guest/gsi.zip | grep -E '(^|/)system\.img(\.gz)?$' | head -1)
          [[ -n "$system_entry" ]]
          if [[ "$system_entry" == *.gz ]]; then
            unzip -p guest/gsi.zip "$system_entry" | gzip -dc > guest/system.img
          else
            unzip -p guest/gsi.zip "$system_entry" > guest/system.img
          fi
          test -s guest/system.img

      - name: Patch Ranchu fstab and prepare direct test disks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_ranchu_vendor.py guest/vendor.img guest/system.img
          python3 tools/patch_ranchu_ramdisk.py guest/ramdisk.img guest/ramdisk.patched.img
          dd if=guest/vendor.img of=guest/vendor.raw.img bs=512 skip=2048 count=212992 status=none
          test "$(stat -c%s guest/vendor.raw.img)" -eq 109051904

      - name: Boot patched Android 15 GSI with desktop Ranchu
        shell: bash
        run: |
          set -uo pipefail
          qemu="$PWD/ranchu-qemu/aarch64-softmmu/qemu-system-aarch64"
          "$qemu" \
            -M ranchu \
            -cpu cortex-a57 \
            -m 4096 \
            -smp 2 \
            -rtc base=utc \
            -kernel "$PWD/guest/kernel-ranchu.raw" \
            -initrd "$PWD/guest/ramdisk.patched.img" \
            -append 'console=ttyAMA0,115200 androidboot.console=ttyAMA1 androidboot.hardware=ranchu androidboot.verifiedbootstate=orange androidboot.qemu=1 androidboot.qemu.vsync=60 androidboot.hardware.egl=angle androidboot.hardware.gralloc=minigbm androidboot.hardware.hwcomposer=ranchu androidboot.hardware.hwcomposer.display_finder_mode=drm androidboot.hardware.hwcomposer.display_framebuffer_format=rgba androidboot.hardware.vulkan=pastel androidboot.qemu.cpuvulkan.version=4202496 androidboot.opengles.version=196609 androidboot.debug.hwui.renderer=opengl androidboot.debug.renderengine.backend=skiagl androidboot.config.low_ram=0 androidboot.dalvik.vm.checkjni=1 androidboot.debug.stagefright.ccodec=4 androidboot.debug.sf.nobootanimation=1 qemu.logcat=start androidboot.selinux=permissive selinux=0 security=selinux enforcing=0 androidboot.dalvik.vm.heapsize=192m' \
            -drive if=none,format=raw,id=userdata,file="$PWD/guest/userdata.img" \
            -device virtio-blk-device,drive=userdata \
            -drive if=none,format=raw,id=system,file="$PWD/guest/system.img",readonly=on \
            -device virtio-blk-device,drive=system \
            -drive if=none,format=raw,id=vendor,file="$PWD/guest/vendor.raw.img",readonly=on \
            -device virtio-blk-device,drive=vendor \
            -display none \
            -monitor none \
            -serial file:serial.log \
            -no-reboot \
            > qemu.stdout 2> qemu.stderr &
          qemu_pid=$!
          booted=0
          for _ in $(seq 1 240); do
            if grep -Eiq 'sys\.boot_completed|boot animation stopped|starting service .zygote|Android runtime started' serial.log 2>/dev/null; then
              booted=1
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "$qemu_pid" 2>/dev/null; then
            kill "$qemu_pid" 2>/dev/null || true
            sleep 2
            kill -KILL "$qemu_pid" 2>/dev/null || true
          fi
          wait "$qemu_pid" 2>/dev/null || true
          tail -300 serial.log 2>/dev/null || true
          cat qemu.stdout 2>/dev/null || true
          cat qemu.stderr 2>/dev/null || true
          if [[ "$booted" != 1 ]]; then
            echo 'No Android boot marker was observed from desktop Ranchu.' >&2
            exit 1
          fi

      - name: Upload desktop Ranchu QEMU
        uses: actions/upload-artifact@v4
        with:
          name: ranchu-host-qemu
          path: |
            ranchu-qemu/aarch64-softmmu/qemu-system-aarch64
            serial.log
            qemu.stdout
            qemu.stderr
          if-no-files-found: ignore
