name: Build Android Ranchu QEMU engine

on:
  workflow_dispatch:
    inputs:
      qemu_ref:
        description: "Android QEMU branch or tag"
        required: true
        default: emu-35-3-release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out app source
        uses: actions/checkout@v4

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential cmake flex gettext gtk-doc-tools \
            libtool make patch pkg-config python3 rsync xz-utils zip
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" "platform-tools" "ndk;27.2.12479018"

      - name: Fetch Android QEMU and Android-native dependencies
        env:
          QEMU_REF: ${{ inputs.qemu_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch Branch_Branch_6.0.1 \
            https://github.com/limboemu/limbo limbo-source
          jni="$PWD/limbo-source/limbo-android-lib/src/main/jni"
          git clone --depth 1 --branch "$QEMU_REF" \
            https://android.googlesource.com/platform/external/qemu "$jni/qemu"
          git -C "$jni/qemu" config submodule.dtc.url https://github.com/qemu/dtc.git
          git -C "$jni/qemu" config submodule.ui/keycodemapdb.url \
            https://gitlab.com/qemu-project/keycodemapdb.git
          git -C "$jni/qemu" submodule update --init --depth 1 dtc ui/keycodemapdb
          git clone --depth 1 --branch "$QEMU_REF" \
            https://android.googlesource.com/platform/hardware/google/aemu /tmp/aemu-source
          mkdir -p "$jni/qemu/android/android-emu/host-common"
          cp /tmp/aemu-source/host-common/include/host-common/goldfish_pipe.h \
            /tmp/aemu-source/host-common/include/host-common/android_pipe_base.h \
            "$jni/qemu/android/android-emu/host-common/"
          python3 "$GITHUB_WORKSPACE/tools/patch_standalone_goldfish_pipe.py" \
            "$jni/qemu/hw/misc/goldfish_pipe.c"
          cp "$GITHUB_WORKSPACE/tools/goldfish_pipe_bridge.cpp" \
            "$jni/qemu/android-qemu2-glue/emulation/goldfish_pipe_bridge.cpp"
          mkdir -p "$GITHUB_WORKSPACE/aosp/hardware/google" \
            "$GITHUB_WORKSPACE/aosp/external" "$GITHUB_WORKSPACE/aosp/system"
          git clone --depth 1 --branch "$QEMU_REF" \
            https://android.googlesource.com/platform/hardware/google/aemu \
            "$GITHUB_WORKSPACE/aosp/hardware/google/aemu"
          git clone --depth 1 --branch "$QEMU_REF" \
            https://android.googlesource.com/platform/hardware/google/gfxstream \
            "$GITHUB_WORKSPACE/aosp/hardware/google/gfxstream"
          git clone --depth 1 --branch "$QEMU_REF" \
            https://android.googlesource.com/platform/external/gfxstream-protocols \
            "$GITHUB_WORKSPACE/aosp/external/gfxstream-protocols"
          git clone --depth 1 --branch "$QEMU_REF" \
            https://android.googlesource.com/platform/external/angle \
            "$GITHUB_WORKSPACE/aosp/external/angle"
          git clone --depth 1 --branch "$QEMU_REF" \
            https://android.googlesource.com/platform/external/flatbuffers \
            "$GITHUB_WORKSPACE/aosp/external/flatbuffers"
          git clone --depth 1 \
            https://android.googlesource.com/platform/external/libdrm \
            "$GITHUB_WORKSPACE/aosp/external/libdrm"
          git clone --depth 1 \
            https://android.googlesource.com/platform/system/core \
            "$GITHUB_WORKSPACE/aosp/system/core"
          python3 "$GITHUB_WORKSPACE/tools/patch_gfxstream_android.py" \
            "$GITHUB_WORKSPACE/aosp/hardware/google/gfxstream"
          curl --fail --location --retry 3 -o /tmp/glib.tar.xz \
            https://download.gnome.org/sources/glib/2.56/glib-2.56.1.tar.xz
          curl --fail --location --retry 3 -o /tmp/libffi.tar.gz \
            https://sourceware.org/pub/libffi/libffi-3.3.tar.gz
          curl --fail --location --retry 3 -o /tmp/pixman.tar.gz \
            https://www.cairographics.org/releases/pixman-0.40.0.tar.gz
          curl --fail --location --retry 3 -o /tmp/sdl2.tar.gz \
            https://www.libsdl.org/release/SDL2-2.0.8.tar.gz
          tar -xf /tmp/glib.tar.xz -C "$jni"
          tar -xf /tmp/libffi.tar.gz -C "$jni"
          tar -xf /tmp/pixman.tar.gz -C "$jni"
          tar -xf /tmp/sdl2.tar.gz -C "$jni"
          mv "$jni/glib-2.56.1" "$jni/glib"
          mv "$jni/libffi-3.3" "$jni/libffi"
          mv "$jni/pixman-0.40.0" "$jni/pixman"
          mv "$jni/SDL2-2.0.8" "$jni/SDL2"
          patch -d "$jni/glib" -p1 < "$jni/patches/glib-2.56.1.patch"
          patch -d "$jni/SDL2" -p1 < "$jni/patches/sdl2-2.0.8.patch"
          python3 - "$jni/pixman/pixman/pixman-bits-image.c" <<'PY'
          import re
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          text = re.sub(
              r"static const float\s+(dither_factor_(?:blue_noise_64|bayer_8)\s*\()",
              r"static float \1",
              text,
          )
          path.write_text(text)
          PY

      - name: Build Android Gfxstream backend
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          cmake -S "$GITHUB_WORKSPACE/aosp/hardware/google/gfxstream" \
            -B "$GITHUB_WORKSPACE/gfxstream-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=26 \
            -DBUILD_STANDALONE=ON \
            -DDEPENDENCY_RESOLUTION=AOSP \
            -DENABLE_VKCEREAL_TESTS=OFF \
            -DBUILD_GRAPHICS_DETECTOR=OFF \
            -DUSE_ANGLE_SHADER_PARSER=OFF \
            -DWITH_BENCHMARK=OFF \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/aosp/system/core/libcutils/include" \
            -DCMAKE_C_FLAGS="-I$GITHUB_WORKSPACE/aosp/system/core/libcutils/include"
          cmake --build "$GITHUB_WORKSPACE/gfxstream-build" \
            --target gfxstream_backend --parallel 2
          test -s "$GITHUB_WORKSPACE/gfxstream-build/libgfxstream_backend.so"

      - name: Build Android QEMU engine
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          jni="$PWD/limbo-source/limbo-android-lib/src/main/jni"
          gfxstream_root="$GITHUB_WORKSPACE/aosp/hardware/google/gfxstream"
          qemu="$jni/qemu"
          wrapper_source="$qemu/android-qemu2-glue/emulation/virtio-gpu-gfxstream-renderer.cpp"
          wrapper_object="$qemu/android-qemu2-glue/virtio-gpu-gfxstream-renderer.o"
          bridge_source="$qemu/android-qemu2-glue/emulation/goldfish_pipe_bridge.cpp"
          bridge_object="$qemu/android-qemu2-glue/emulation/goldfish_pipe_bridge.o"
          test -s "$wrapper_source"
          test -s "$bridge_source"
          python3 "$GITHUB_WORKSPACE/tools/patch_qemu_gfxstream_direct.py" \
            "$qemu/hw/display/virtio-gpu-3d.c"
          python3 - "$wrapper_source" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          text = text.replace('#include "android/utils/dll.h"', '#include <dlfcn.h>', 1)
          text = text.replace(
              '    ADynamicLibrary* rendererSo = adynamicLibrary_open(RENDERER_LIB_NAME, &error);',
              '    void* rendererSo = dlopen(RENDERER_LIB_NAME ".so", RTLD_NOW | RTLD_LOCAL);', 1)
          text = text.replace(
              '    symbol = adynamicLibrary_findSymbol(rendererSo, #api, &error);',
              '    symbol = dlsym(rendererSo, #api);', 1)
          text = text.replace('        free(error);\n', '', 1)
          text = text.replace(
              'BAD_EXIT:\n    adynamicLibrary_close(rendererSo);\n    return ret;',
              'BAD_EXIT:\n    return ret;', 1)
          path.write_text(text)
          PY
          python3 "$GITHUB_WORKSPACE/tools/patch_gfxstream_qemu_wrapper.py" \
            "$wrapper_source"
          python3 "$GITHUB_WORKSPACE/tools/patch_qemu_sdl_gfxstream_window.py" \
            "$qemu/ui/sdl2.c"
          export PATH="$ndk:$PATH"
          # SDL 2.0.8 declares the GLES shader-source callback with the
          # pre-NDK-r27 const signature.
          sed -i 's/const GLchar \*\*, const GLint \*/const GLchar *const *, const GLint */' \
            "$jni/SDL2/src/render/opengles2/SDL_gles2funcs.h"
          sed -i '/#include <unistd.h>/a #include <malloc.h>' "$jni/compat/limbo_compat.c"
          sed -i 's/int endofs = s + length;/const char *endofs = s + length;/' \
            "$jni/compat/limbo_compat.c"
          # Android does not expose the host openpty() API used by this
          # optional QEMU utility. Keep the symbol available through the
          # compatibility library, but report PTY as unsupported.
          sed -i 's/ qemu-openpty\.o//' "$jni/qemu/util/Makefile.objs"
          python3 - "$jni/compat/limbo_compat.c" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          addition = """

          int qemu_openpty_raw(int *aslave, char *pty_name) {
              (void) aslave;
              (void) pty_name;
              return -1;
          }
          """
          if "int qemu_openpty_raw(" not in text:
              path.write_text(text + addition)
          PY
          # Android's allocator does not provide the optional QEMU malloc
          # replacement hooks used for large host mappings.
          sed -i '/MallocHook_SetMmapReplacement/d; /MallocHook_SetMunmapReplacement/d' \
            "$jni/qemu/util/mmap-alloc.c"
          python3 - "$jni/qemu/stubs/android-tpm-backend.c" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          path.write_text("""#include \"qemu/osdep.h\"
          #include \"sysemu/tpm_backend.h\"

          TPMInfo *tpm_backend_query_tpm(TPMBackend *backend) {
              (void) backend;
              return NULL;
          }
          """)
          PY
          # NDK r27 removed the legacy GCC 4.9 toolchain directory. Limbo's
          # ARMv8 linker flags still reference it, but Clang already selects
          # the NDK LLVM toolchain above.
          sed -i '/ARCH_LD_FLAGS += -Wc,-gcc-toolchain/d' \
            "$jni/android-config/android-device-config/android-armv8.mak"
          python3 - "$jni/android-config/android-qemu-config.mak" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          text = text.replace(
              "\t--cross-prefix=$(TOOLCHAIN_PREFIX)- \\\n",
              "\t--cross-prefix= \\\n",
          )
          path.write_text(text)
          PY
          mkdir -p "$jni/pkgconfig"
          python3 - "$jni/pkgconfig/sdl2.pc" "$jni" <<'PY'
          from pathlib import Path
          import sys
          pc_path = Path(sys.argv[1])
          jni = Path(sys.argv[2]).resolve()
          pc_path.write_text(
              "prefix=%s\n"
              "exec_prefix=${prefix}\n"
              "libdir=%s/../obj/local/arm64-v8a\n"
              "includedir=%s/SDL2/include\n\n"
              "Name: SDL2\n"
              "Description: SDL 2 for the Android engine\n"
              "Version: 2.0.8\n"
              "Libs: -L${libdir} -lSDL2\n"
              "Cflags: -I${includedir}\n"
              % (jni, jni, jni)
          )
          PY
          python3 - "$jni/pkgconfig" "$jni" <<'PY'
          from pathlib import Path
          import sys
          out = Path(sys.argv[1])
          jni = Path(sys.argv[2]).resolve()
          common = (
              "prefix=%s\n"
              "exec_prefix=${prefix}\n"
              "libdir=%s/../obj/local/arm64-v8a\n"
              "includedir=%s/glib\n\n"
              "Version: 2.56.1\n"
              "Libs: -L${libdir} -lglib-2.0\n"
              "Cflags: -I${includedir} -I%s/glib/glib\n"
              % (jni, jni, jni, jni)
          )
          for name, description in (("glib-2.0", "GLib"), ("gthread-2.0", "GThread")):
              (out / f"{name}.pc").write_text(
                  f"Name: {description}\nDescription: Android {description}\n" + common
              )
          (out / "pixman-1.pc").write_text(
              "Name: pixman-1\n"
              "Description: Android Pixman\n"
              "Version: 0.40.0\n"
              "Libs: -L%s/../obj/local/arm64-v8a -lpixman-1\n"
              "Cflags: -I%s/pixman -I%s/pixman/pixman\n"
              % (jni, jni, jni)
          )
          PY
          export PKG_CONFIG_PATH="$jni/pkgconfig"
          # The Android branch contains a legacy Python 2-only probe. The
          # generated build itself works with Python 3 on the runner.
          sed -i 's/sys.version_info < (2,6) or sys.version_info >= (3,)/sys.version_info < (2,6)/' "$jni/qemu/configure"
          python3 - "$jni/glib/glib/gatomic.h" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          replacements = {
              "(gssize) __sync_fetch_and_add ((atomic), (val))":
                  "(gssize) __sync_fetch_and_add ((volatile gsize *) (atomic), (gsize) (val))",
              "(gsize) __sync_fetch_and_and ((atomic), (val))":
                  "(gsize) __sync_fetch_and_and ((volatile gsize *) (atomic), (gsize) (val))",
              "(gsize) __sync_fetch_and_or ((atomic), (val))":
                  "(gsize) __sync_fetch_and_or ((volatile gsize *) (atomic), (gsize) (val))",
              "(gsize) __sync_fetch_and_xor ((atomic), (val))":
                  "(gsize) __sync_fetch_and_xor ((volatile gsize *) (atomic), (gsize) (val))",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
          python3 - "$jni/qemu/hw/display/virtio-gpu.c" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          old = "    data = virgl_renderer_get_cursor_data(resource_id, &width, &height);"
          if old not in text:
              raise SystemExit('virtio-gpu VirGL fallback was not found')
          path.write_text(text.replace(old, "    data = NULL;", 1))
          PY
          python3 - "$jni/qemu/hw/vfio/Makefile.objs" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          old = "ifeq ($(CONFIG_LINUX), y)"
          if old not in text:
              raise SystemExit('VFIO makefile guard was not found')
          path.write_text(text.replace(old, "ifeq ($(CONFIG_VFIO), y)", 1))
          PY
          python3 - "$jni/qemu/vl.c" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          old = "    if (!default_net && !feature_is_enabled(kFeature_WiFiPacketStream)) {"
          if old not in text:
              raise SystemExit('QEMU feature-control network guard was not found')
          path.write_text(text.replace(old, "    if (!default_net) {", 1))
          PY
          python3 - "$jni/qemu/slirp/misc.c" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          old = "for (s = getdtablesize() - 1; s >= 3; s--)"
          if old not in text:
              raise SystemExit('slirp getdtablesize call was not found')
          path.write_text(text.replace(old, "for (s = 1024 - 1; s >= 3; s--)", 1))
          PY
          # Limbo's Android link rule is also the desired shared-library
          # boundary for QEMU's qemu_init/qemu_main_loop API.
          python3 - "$jni/qemu/Makefile.target" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          old = "$(QEMU_PROG_BUILD): $(all-obj-y) $(COMMON_LDADDS)\n\t$(call LINK, $(filter-out %.mak, $^))"
          new = "# Android app shared-library link rule\ninclude ../../android-qemu-build.mak"
          if old not in text:
              raise SystemExit('QEMU Makefile.target link rule was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 - "$jni/android-qemu-build.mak" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          old = """ifeq ($(USE_SLIRP_LIB),true)
          \tslirplib=../../qemu/slirp/libslirp.a
          \tRELINK_LIBSLIRP=$(OBJ_COPY) $(RELINK_PARAMS) $(slirplib)
          \tRELINK_LIBSLIRP_2=$(OBJ_COPY) $(RELINK_PARAMS_2) $(slirplib)
          endif
          """
          new = """ifeq ($(USE_SLIRP_LIB),true)
          \tslirplib=../../qemu/slirp/libslirp.a
          \tslirpobj=$(filter ../slirp/%.o,$(all-obj-y))
          \tRELINK_LIBSLIRP=$(OBJ_COPY) $(RELINK_PARAMS) $(slirplib)
          \tRELINK_LIBSLIRP_2=$(OBJ_COPY) $(RELINK_PARAMS_2) $(slirplib)
          $(slirplib): $(slirpobj)
          \t$(AR) rcs $@ $(slirpobj)
          endif

          QEMU_UTIL_STUB=../libqemustub.a

          $(fdtlib):
          \t$(MAKE) -I../../qemu/dtc VPATH=../../qemu/dtc -C ../../qemu/dtc \
          \t\tLIBFDT_srcdir=../../qemu/dtc/libfdt \
          \t\tCPPFLAGS="-I../../qemu/dtc -I../../qemu/dtc/libfdt" \
          \t\tCFLAGS="$(CFLAGS) $(QEMU_CFLAGS)" \
          \t\tLDFLAGS="$(LDFLAGS)" ARFLAGS="$(ARFLAGS)" \
          \t\tCC="$(CC)" AR="$(AR)" LD="$(LD)" libfdt/libfdt.a

          dummy := $(call unnest-vars,.., util-obj-y stub-obj-y)
          qemuutilobj=$(sort $(util-obj-y) \
            ../trace-root.o ../qapi/trace.o ../accel/tcg/trace.o \
            ../accel/kvm/trace.o ../nbd/trace.o ../scsi/trace.o \
            $(foreach trace_dir,$(trace-events-subdirs),../$(trace_dir)/trace.o))
          # The Android QEMU makefile is included from Limbo's target build
          # directory.  Its trace subdirectory entries are emitted as bare
          # names by this older unnest-vars implementation, so normalize them
          # before creating the utility archive.
          qemuutilobj := $(patsubst ../control.o,../trace/control.o,$(qemuutilobj))
          qemuutilobj := $(patsubst ../qmp.o,../trace/qmp.o,$(qemuutilobj))
          qemuutilobj := $(patsubst ../generated-events.o,../trace/generated-events.o,$(qemuutilobj))
          qemuutilobj := $(patsubst ../generated-tracers.o,../trace/generated-tracers.o,$(qemuutilobj))
          qemuutilobj := $(patsubst ../simple.o,../trace/simple.o,$(qemuutilobj))
          qemuutilobj := $(patsubst ../ftrace.o,../trace/ftrace.o,$(qemuutilobj))
          $(COMMON_LDADDS): $(qemuutilobj)
          \t$(AR) rcs $@ $(qemuutilobj)

          qemustubobj=$(sort $(stub-obj-y))
          qemustubobj := $(patsubst ../pbkdf-stub.o,../crypto/pbkdf-stub.o,$(qemustubobj))
          qemustubobj := $(filter-out ../stubs/tpm.o,$(qemustubobj))
          qemustubobj += ../stubs/android-tpm-backend.o
          $(QEMU_UTIL_STUB): $(qemustubobj)
          \t$(AR) rcs $@ $(qemustubobj)
          """
          if old not in text:
              raise SystemExit('Limbo slirp link block was not found')
          updated = text.replace(old, new, 1)
          updated = updated.replace(
              "qemu-static: $(all-obj-y) $(COMMON_LDADDS)",
              "qemu-static: $(all-obj-y) $(COMMON_LDADDS) $(QEMU_UTIL_STUB) $(slirplib) $(fdtlib)",
              1,
          )
          updated = updated.replace(
              "\t-Wl,--no-whole-archive \\\n",
              "",
              1,
          )
          updated = updated.replace(
              "\t$(QEMU_UTIL_LIB) \\\n",
              "\t-Wl,--no-whole-archive \\\n\t$(QEMU_UTIL_LIB) \\\n",
              1,
          )
          updated = updated.replace(
              "\t$(QEMU_UTIL_STUB) \\\n\t-Wl,--no-whole-archive \\\n",
              "\t$(QEMU_UTIL_STUB) \\\n",
              1,
          )
          updated = updated.replace(
              "\t$(STL_LIB) \\\n",
              "\t-lc++_shared \\\n\t$(STL_LIB) \\\n",
              1,
          )
          path.write_text(updated)
          PY
          python3 - "$jni/Makefile" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          text = text.replace("./qemu/VERSION", "./qemu/QEMU_VERSION")
          old = "cd $(LIMBO_JNI_ROOT)/qemu && $(MAKE) all -j $(BUILD_THREADS) BUILD_GUEST=$(BUILD_GUEST)"
