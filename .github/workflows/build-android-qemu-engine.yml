name: Build Android Ranchu QEMU engine

on:
  workflow_dispatch:
    inputs:
      qemu_ref:
        description: "Android QEMU branch or tag"
        required: true
        default: emu-35-3-release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out app source
        uses: actions/checkout@v4

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential flex gettext gtk-doc-tools \
            libtool make patch pkg-config python3 rsync xz-utils zip

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" "platform-tools" "ndk;27.2.12479018"

      - name: Fetch Android QEMU and Android-native dependencies
        env:
          QEMU_REF: ${{ inputs.qemu_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch Branch_Branch_6.0.1 \
            https://github.com/limboemu/limbo limbo-source
          jni="$PWD/limbo-source/limbo-android-lib/src/main/jni"
          git clone --depth 1 --branch "$QEMU_REF" \
            https://android.googlesource.com/platform/external/qemu "$jni/qemu"
          curl --fail --location --retry 3 -o /tmp/glib.tar.xz \
            https://download.gnome.org/sources/glib/2.56/glib-2.56.1.tar.xz
          curl --fail --location --retry 3 -o /tmp/libffi.tar.gz \
            https://sourceware.org/pub/libffi/libffi-3.3.tar.gz
          curl --fail --location --retry 3 -o /tmp/pixman.tar.gz \
            https://www.cairographics.org/releases/pixman-0.40.0.tar.gz
          curl --fail --location --retry 3 -o /tmp/sdl2.tar.gz \
            https://www.libsdl.org/release/SDL2-2.0.8.tar.gz
          tar -xf /tmp/glib.tar.xz -C "$jni"
          tar -xf /tmp/libffi.tar.gz -C "$jni"
          tar -xf /tmp/pixman.tar.gz -C "$jni"
          tar -xf /tmp/sdl2.tar.gz -C "$jni"
          mv "$jni/glib-2.56.1" "$jni/glib"
          mv "$jni/libffi-3.3" "$jni/libffi"
          mv "$jni/pixman-0.40.0" "$jni/pixman"
          mv "$jni/SDL2-2.0.8" "$jni/SDL2"
          patch -d "$jni/glib" -p1 < "$jni/patches/glib-2.56.1.patch"
          patch -d "$jni/SDL2" -p1 < "$jni/patches/sdl2-2.0.8.patch"
          python3 - "$jni/pixman/pixman/pixman-bits-image.c" <<'PY'
          import re
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          text = re.sub(
              r"static const float\s+(dither_factor_(?:blue_noise_64|bayer_8)\s*\()",
              r"static float \1",
              text,
          )
          path.write_text(text)
          PY

      - name: Build Android QEMU engine
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          jni="$PWD/limbo-source/limbo-android-lib/src/main/jni"
          export PATH="$ndk:$PATH"
          # SDL 2.0.8 declares the GLES shader-source callback with the
          # pre-NDK-r27 const signature.
          sed -i 's/const GLchar \*\*, const GLint \*/const GLchar *const *, const GLint */' \
            "$jni/SDL2/src/render/opengles2/SDL_gles2funcs.h"
          sed -i '/#include <unistd.h>/a #include <malloc.h>' "$jni/compat/limbo_compat.c"
          sed -i 's/int endofs = s + length;/const char *endofs = s + length;/' \
            "$jni/compat/limbo_compat.c"
          # NDK r27 removed the legacy GCC 4.9 toolchain directory. Limbo's
          # ARMv8 linker flags still reference it, but Clang already selects
          # the NDK LLVM toolchain above.
          sed -i '/ARCH_LD_FLAGS += -Wc,-gcc-toolchain/d' \
            "$jni/android-config/android-device-config/android-armv8.mak"
          python3 - "$jni/android-config/android-qemu-config.mak" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          text = text.replace(
              "\t--cross-prefix=$(TOOLCHAIN_PREFIX)- \\\n",
              "\t--cross-prefix= \\\n",
          )
          path.write_text(text)
          PY
          mkdir -p "$jni/pkgconfig"
          python3 - "$jni/pkgconfig/sdl2.pc" "$jni" <<'PY'
          from pathlib import Path
          import sys
          pc_path = Path(sys.argv[1])
          jni = Path(sys.argv[2]).resolve()
          pc_path.write_text(
              "prefix=%s\n"
              "exec_prefix=${prefix}\n"
              "libdir=%s/../obj/local/arm64-v8a\n"
              "includedir=%s/SDL2/include\n\n"
              "Name: SDL2\n"
              "Description: SDL 2 for the Android engine\n"
              "Version: 2.0.8\n"
              "Libs: -L${libdir} -lSDL2\n"
              "Cflags: -I${includedir}\n"
              % (jni, jni, jni)
          )
          PY
          python3 - "$jni/pkgconfig" "$jni" <<'PY'
          from pathlib import Path
          import sys
          out = Path(sys.argv[1])
          jni = Path(sys.argv[2]).resolve()
          common = (
              "prefix=%s\n"
              "exec_prefix=${prefix}\n"
              "libdir=%s/../obj/local/arm64-v8a\n"
              "includedir=%s/glib\n\n"
              "Version: 2.56.1\n"
              "Libs: -L${libdir} -lglib-2.0\n"
              "Cflags: -I${includedir} -I%s/glib/glib\n"
              % (jni, jni, jni, jni)
          )
          for name, description in (("glib-2.0", "GLib"), ("gthread-2.0", "GThread")):
              (out / f"{name}.pc").write_text(
                  f"Name: {description}\nDescription: Android {description}\n" + common
              )
          (out / "pixman-1.pc").write_text(
              "Name: pixman-1\n"
              "Description: Android Pixman\n"
              "Version: 0.40.0\n"
              "Libs: -L%s/../obj/local/arm64-v8a -lpixman-1\n"
              "Cflags: -I%s/pixman -I%s/pixman/pixman\n"
              % (jni, jni, jni)
          )
          PY
          export PKG_CONFIG_PATH="$jni/pkgconfig"
          # The Android branch contains a legacy Python 2-only probe. The
          # generated build itself works with Python 3 on the runner.
          sed -i 's/sys.version_info < (2,6) or sys.version_info >= (3,)/sys.version_info < (2,6)/' "$jni/qemu/configure"
          python3 - "$jni/glib/glib/gatomic.h" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          replacements = {
              "(gssize) __sync_fetch_and_add ((atomic), (val))":
                  "(gssize) __sync_fetch_and_add ((volatile gsize *) (atomic), (gsize) (val))",
              "(gsize) __sync_fetch_and_and ((atomic), (val))":
                  "(gsize) __sync_fetch_and_and ((volatile gsize *) (atomic), (gsize) (val))",
              "(gsize) __sync_fetch_and_or ((atomic), (val))":
                  "(gsize) __sync_fetch_and_or ((volatile gsize *) (atomic), (gsize) (val))",
              "(gsize) __sync_fetch_and_xor ((atomic), (val))":
                  "(gsize) __sync_fetch_and_xor ((volatile gsize *) (atomic), (gsize) (val))",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
          # Limbo's Android link rule is also the desired shared-library
          # boundary for QEMU's qemu_init/qemu_main_loop API.
          python3 - "$jni/qemu/Makefile.target" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          old = "$(QEMU_PROG_BUILD): $(all-obj-y) $(COMMON_LDADDS)\n\t$(call LINK, $(filter-out %.mak, $^))"
          new = "# Android app shared-library link rule\ninclude ../../android-qemu-build.mak"
          if old not in text:
              raise SystemExit('QEMU Makefile.target link rule was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 - "$jni/Makefile" <<'PY'
          from pathlib import Path
          path = Path(__import__('sys').argv[1])
          text = path.read_text()
          text = text.replace("./qemu/VERSION", "./qemu/QEMU_VERSION")
          old = "cd $(LIMBO_JNI_ROOT)/qemu && $(MAKE) all -j $(BUILD_THREADS) BUILD_GUEST=$(BUILD_GUEST)"
          new = "cd $(LIMBO_JNI_ROOT)/qemu && $(MAKE) $(BUILD_GUEST)/config-devices.mak && cd $(BUILD_GUEST) && $(MAKE) -f Makefile all -j $(BUILD_THREADS) BUILD_GUEST=$(BUILD_GUEST)"
          if old not in text:
              raise SystemExit('Limbo QEMU build rule was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          make -C "$jni" limbo \
            NDK_ROOT="$ndk" \
            BUILD_HOST=arm64-v8a APP_ABI=arm64-v8a \
            BUILD_GUEST=aarch64-softmmu \
            USE_QEMU_VERSION=5.1.0 \
            NDK_ENV=linux-x86_64 NDK_PLATFORM_API=21 \
            NDK_TOOLCHAIN_VERSION=clang USE_AAUDIO=false \
            BUILD_THREADS="$(nproc)"
          file "$jni/libs/arm64-v8a/libqemu-system-aarch64.so"

      - name: Package engine artifact
        shell: bash
        run: |
          set -euo pipefail
          jni="$PWD/limbo-source/limbo-android-lib/src/main/jni"
          mkdir -p engine
          cp "$jni/../libs/arm64-v8a/"*.so engine/
          strip_bin="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for library in engine/*.so; do
            "$strip_bin" "$library" || true
          done
          sha256sum engine/*.so > engine/SHA256SUMS.txt

      - name: Upload Android QEMU engine
        uses: actions/upload-artifact@v4
        with:
          name: android-ranchu-qemu-engine
          path: engine
