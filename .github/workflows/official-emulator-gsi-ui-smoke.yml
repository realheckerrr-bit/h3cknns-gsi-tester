name: Official emulator GSI UI smoke test

on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: Official ARM64 GSI ZIP URL
        required: true
        default: https://dl.google.com/developers/android/cinnamonbun/images/gsi/aosp_arm64-exp-CP41.260831.007-16416850-5e61c946.zip
      gsi_sha256:
        description: SHA-256 for the GSI ZIP (empty disables the check)
        required: false
        default: 5e61c946ee45680365336968827bf62509d90f66ed78938f88e4deedda40a7fe

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install emulator and ARM64 guest image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "emulator" "platform-tools" "system-images;android-35;google_apis;arm64-v8a"

      - name: Install screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick python3-pil

      - name: Prepare patched Ranchu guest and GSI
        shell: bash
        env:
          GSI_URL: ${{ inputs.gsi_url }}
          GSI_SHA256: ${{ inputs.gsi_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p guest
          image_root="$ANDROID_SDK_ROOT/system-images/android-35/google_apis/arm64-v8a"
          test -s "$image_root/kernel-ranchu"
          test -s "$image_root/ramdisk.img"
          test -s "$image_root/vendor.img"
          cp "$image_root/kernel-ranchu" guest/kernel-ranchu
          cp "$image_root/ramdisk.img" guest/ramdisk.img
          cp "$image_root/vendor.img" guest/vendor.img
          if [[ -f "$image_root/userdata.img" ]]; then
            cp "$image_root/userdata.img" guest/userdata.img
          fi
          curl --fail --location --retry 3 --retry-delay 3 \
            -o guest/gsi.zip "$GSI_URL"
          if [[ -n "$GSI_SHA256" ]]; then
            echo "$GSI_SHA256  guest/gsi.zip" | sha256sum --check --status
          fi
          system_entry=$(unzip -Z1 guest/gsi.zip | grep -E '(^|/)system\.img(\.gz|\.xz)?$' | head -1)
          [[ -n "$system_entry" ]]
          case "$system_entry" in
            *.gz) unzip -p guest/gsi.zip "$system_entry" | gzip -dc > guest/system.img ;;
            *.xz) unzip -p guest/gsi.zip "$system_entry" | xz -dc > guest/system.img ;;
            *) unzip -p guest/gsi.zip "$system_entry" > guest/system.img ;;
          esac
          test -s guest/system.img
          python3 tools/patch_ranchu_vendor.py guest/vendor.img guest/system.img
          python3 tools/patch_ranchu_ramdisk.py guest/ramdisk.img guest/ramdisk.patched.img
          mv guest/ramdisk.patched.img guest/ramdisk.img
          # The emulator AVD uses image.sysdir.1 for the guest contract. Keep
          # the patched files together so the official emulator supplies its
          # own gfxstream/QEMU frontend while this workflow supplies the GSI.
          echo "guest_dir=$PWD/guest"
          sha256sum guest/kernel-ranchu guest/ramdisk.img guest/vendor.img guest/system.img

      - name: Create ARM64 GSI AVD
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          printf '\n' | avdmanager create avd \
            --name gsi-arm64 \
            --package 'system-images;android-35;google_apis;arm64-v8a' \
            --force
          avd_dir="$ANDROID_AVD_HOME/avd/gsi-arm64.avd"
          test -f "$avd_dir/config.ini"
          sed -i "s|^image.sysdir.1=.*|image.sysdir.1=$PWD/guest/|" "$avd_dir/config.ini"
          printf '%s\n' \
            'hw.cpu.arch=arm64-v8a' \
            'hw.cpu.ncore=2' \
            'hw.ramSize=4096' \
            'hw.gpu.enabled=yes' \
            'hw.gpu.mode=swiftshader_indirect' \
            'showDeviceFrame=no' \
            'fastboot.forceColdBoot=yes' >> "$avd_dir/config.ini"
          grep -E '^(image.sysdir.1|hw.cpu.arch|hw.gpu.mode|hw.ramSize)=' "$avd_dir/config.ini"

      - name: Boot GSI with official Android Emulator gfxstream
        shell: bash
        run: |
          set -uo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME/emulator"
          mkdir -p "$ANDROID_EMULATOR_HOME"
          emulator_bin="$ANDROID_SDK_ROOT/emulator/emulator"
          adb start-server
          "$emulator_bin" \
            -avd gsi-arm64 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            -show-kernel \
            > emulator.log 2>&1 &
          emulator_pid=$!
          booted=0
          for _ in $(seq 1 900); do
            if adb get-state 2>/dev/null | grep -q '^device$' && [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == '1' ]]; then
              booted=1
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ "$booted" == 1 ]]; then
            adb shell wm size || true
            adb shell getprop ro.build.version.release || true
            adb exec-out screencap -p > screen.png
            test -s screen.png
            python3 - <<'PY'
          from PIL import Image
          image = Image.open('screen.png').convert('RGB')
          pixels = list(image.getdata())
          non_black = sum(1 for r, g, b in pixels if r + g + b > 24)
          ratio = non_black / len(pixels)
          print(f'screenshot={image.size[0]}x{image.size[1]} non_black_ratio={ratio:.4f}')
          if ratio < 0.01:
              raise SystemExit('official emulator produced an effectively blank frame')
          image.save('screen-verified.png')
          PY
          fi
          if kill -0 "$emulator_pid" 2>/dev/null; then
            kill "$emulator_pid" 2>/dev/null || true
            sleep 3
            kill -KILL "$emulator_pid" 2>/dev/null || true
          fi
          wait "$emulator_pid" 2>/dev/null || true
          tail -300 emulator.log || true
          if [[ "$booted" != 1 ]]; then
            echo 'Official emulator did not reach sys.boot_completed.' >&2
            exit 1
          fi

      - name: Upload official emulator UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-emulator-gsi-ui-smoke
          path: |
            emulator.log
            screen.png
            screen-verified.png
          if-no-files-found: ignore
