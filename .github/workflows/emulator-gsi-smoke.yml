name: Android Emulator GSI boot smoke test

on:
  workflow_dispatch:
    inputs:
      system_source:
        description: "System image to boot against the Ranchu guest"
        required: true
        default: gsi
        type: choice
        options:
          - gsi
          - stock
      gsi_url:
        description: "Official ARM64 GSI ZIP URL"
        required: true
        default: https://dl.google.com/developers/android/vic/images/gsi/aosp_arm64-exp-AP4A.241205.013-12621605-14e72a7c.zip
      gsi_sha256:
        description: "SHA-256 for the GSI ZIP (empty disables the check)"
        required: false
        default: 14e72a7c1b6b6600ba4f7b6057c79e531bbb9aa763e9e998ab5e1a8709e5075b

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ARM QEMU and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio e2fsprogs ipxe-qemu libegl1 libgl1-mesa-dri libvirglrenderer1 lz4 qemu-system-arm qemu-system-common qemu-system-gui qemu-system-modules-opengl unzip x11-xserver-utils xvfb xz-utils

      - name: Install official Android Emulator host
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install emulator package
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "emulator" "platform-tools"

      - name: Download official ARM64 Emulator guest pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p guest
          curl --fail --location --retry 3 --retry-delay 3 \
            -o guest/emulator.zip \
            https://dl.google.com/android/repository/sys-img/google_apis/arm64-v8a-35_r08.zip
          entries=$(unzip -Z1 guest/emulator.zip)
          printf '%s\n' "$entries" | grep -E '(kernel-ranchu|ramdisk\.img|vendor\.img|userdata\.img|encryptionkey\.img)' || true
          for asset in kernel-ranchu ramdisk.img; do
            entry=$(printf '%s\n' "$entries" | grep -E "(^|/)$asset$" | head -1 || true)
            [[ -n "$entry" ]]
            unzip -p guest/emulator.zip "$entry" > "guest/$asset"
            test -s "guest/$asset"
          done
          vendor_gz_entry=$(printf '%s\n' "$entries" | grep -E '(^|/)vendor\.img\.gz$' | head -1 || true)
          vendor_raw_entry=$(printf '%s\n' "$entries" | grep -E '(^|/)vendor\.img$' | head -1 || true)
          if [[ -n "$vendor_gz_entry" ]]; then
            unzip -p guest/emulator.zip "$vendor_gz_entry" | gzip -dc > guest/vendor.img
          else
            [[ -n "$vendor_raw_entry" ]]
            unzip -p guest/emulator.zip "$vendor_raw_entry" > guest/vendor.img
          fi
          test -s guest/vendor.img
          encryption_entry=$(printf '%s\n' "$entries" | grep -E '(^|/)encryptionkey\.img$' | head -1 || true)
          if [[ -n "$encryption_entry" ]]; then
            unzip -p guest/emulator.zip "$encryption_entry" > guest/encryptionkey.img
            test -s guest/encryptionkey.img
          fi
          userdata_entry=$(printf '%s\n' "$entries" | grep -E '(^|/)userdata\.img$' | head -1 || true)
          if [[ -n "$userdata_entry" ]]; then
            unzip -p guest/emulator.zip "$userdata_entry" > guest/userdata.img
            test -s guest/userdata.img
          else
            truncate -s 2G guest/userdata.img
            mkfs.ext4 -F -L userdata guest/userdata.img >/dev/null
          fi
          test -s guest/userdata.img

      - name: Download and verify official Android 15 ARM64 AOSP GSI
        if: inputs.system_source != 'stock'
        shell: bash
        env:
          GSI_URL: ${{ inputs.gsi_url }}
          GSI_SHA256: ${{ inputs.gsi_sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            -o guest/gsi.zip \
            "$GSI_URL"
          if [[ -n "$GSI_SHA256" ]]; then
            echo "$GSI_SHA256  guest/gsi.zip" | sha256sum --check --status
          fi
          system_entry=$(unzip -Z1 guest/gsi.zip | grep -E '(^|/)system\.img(\.gz)?$' | head -1)
          [[ -n "$system_entry" ]]
          if [[ "$system_entry" == *.gz ]]; then
            unzip -p guest/gsi.zip "$system_entry" | gzip -dc > guest/system.img
          else
            unzip -p guest/gsi.zip "$system_entry" > guest/system.img
          fi
          test -s guest/system.img

      - name: Extract stock Android Emulator system image
        if: inputs.system_source == 'stock'
        shell: bash
        run: |
          set -euo pipefail
          entries=$(unzip -Z1 guest/emulator.zip)
          system_entry=$(printf '%s\n' "$entries" | grep -E '(^|/)system\.img$' | head -1)
          [[ -n "$system_entry" ]]
          unzip -p guest/emulator.zip "$system_entry" > guest/system.img
          test -s guest/system.img

      - name: Adapt Ranchu vendor fstab for direct GSI system and vendor disks
        run: |
          python3 tools/patch_ranchu_vendor.py guest/vendor.img
          python3 tools/patch_ranchu_vendor.py guest/system.img
          python3 tools/patch_ranchu_ramdisk.py guest/ramdisk.img guest/ramdisk.patched.img
          dd if=guest/vendor.img of=guest/vendor.raw.img bs=512 skip=2048 count=212992 status=none
          test "$(stat -c%s guest/vendor.raw.img)" -eq 109051904
          lz4 -t guest/ramdisk.patched.img || true
          lz4 -d -f guest/ramdisk.patched.img guest/ramdisk.raw || true
          echo '--- patched ramdisk entries ---'
          cpio -itv < guest/ramdisk.raw 2>&1 | grep -E '(^|/)(lib|lib/modules|virtio_|init|fstab)' | head -100 || true
          echo '--- vendor strings containing fstab or partition mounts ---'
          strings -a guest/vendor.img | grep -Ei 'fstab|/metadata|/system .*logical|/vendor .*logical' | head -100 || true
          for fstab in fstab.ranchu fstab.ranchu.initrd fstab.emulator fstab.goldfish; do
            if debugfs -R "cat etc/$fstab" guest/vendor.img > "guest/$fstab" 2>/dev/null; then
              echo "--- etc/$fstab ---"
              sed -n '1,120p' "guest/$fstab"
            fi
          done
          echo '--- vendor filesystem root ---'
          fdisk -l guest/vendor.img 2>&1 | head -80 || true
          debugfs -R 'ls -p /' guest/vendor.img 2>&1 | head -80 || true
          echo '--- vendor etc listing ---'
          debugfs -R 'ls -p /etc' guest/vendor.img 2>&1 | head -120 || true

      - name: Run current Ranchu QEMU directly with the patched GSI
        shell: bash
        run: |
          set -uo pipefail
          qemu_bin=$(find "$ANDROID_HOME/emulator" -type f -name qemu-system-aarch64 -perm -111 | head -1 || true)
          test -n "$qemu_bin"
          "$qemu_bin" \
            -M ranchu \
            -cpu max \
            -m 4096 \
            -smp 4 \
            -rtc base=utc \
            -kernel "$PWD/guest/kernel-ranchu" \
            -initrd "$PWD/guest/ramdisk.patched.img" \
            -append 'console=ttyAMA0,115200 androidboot.console=ttyAMA1 androidboot.hardware=ranchu androidboot.verifiedbootstate=orange androidboot.qemu=1 androidboot.qemu.vsync=60 androidboot.hardware.egl=angle androidboot.hardware.gralloc=minigbm androidboot.hardware.hwcomposer=ranchu androidboot.hardware.hwcomposer.display_finder_mode=drm androidboot.hardware.hwcomposer.display_framebuffer_format=rgba androidboot.hardware.vulkan=pastel androidboot.qemu.cpuvulkan.version=4202496 androidboot.opengles.version=196609 androidboot.debug.hwui.renderer=opengl androidboot.debug.renderengine.backend=skiagl androidboot.config.low_ram=0 androidboot.dalvik.vm.checkjni=1 androidboot.debug.stagefright.ccodec=4 androidboot.debug.sf.nobootanimation=1 qemu.logcat=start androidboot.selinux=permissive selinux=0 security=selinux enforcing=0 androidboot.dalvik.vm.heapsize=192m' \
            -drive if=none,format=raw,id=userdata,file="$PWD/guest/userdata.img" \
            -device virtio-blk-device,drive=userdata \
            -drive if=none,format=raw,id=system,file="$PWD/guest/system.img",readonly=on \
            -device virtio-blk-device,drive=system \
            -drive if=none,format=raw,id=vendor,file="$PWD/guest/vendor.raw.img",readonly=on \
            -device virtio-blk-device,drive=vendor \
            -display none \
            -monitor none \
            -serial file:serial.log \
            -no-reboot \
            > qemu.stdout 2> qemu.stderr &
          emulator_pid=$!
          booted=0
          for _ in $(seq 1 240); do
            if grep -Eiq 'sys\.boot_completed|boot animation stopped|starting service .zygote|Android runtime started' serial.log 2>/dev/null; then
              booted=1
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "$emulator_pid" 2>/dev/null; then
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
          else
            wait "$emulator_pid" 2>/dev/null || true
          fi
          tail -300 serial.log 2>/dev/null || true
          cat qemu.stdout 2>/dev/null || true
          cat qemu.stderr 2>/dev/null || true
          if [[ "$booted" != 1 ]]; then
            echo 'No Android boot marker was observed from current Ranchu QEMU.' >&2
            exit 1
          fi

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-gsi-boot-logs
          path: |
            serial.log
            qemu.stdout
            qemu.stderr
          if-no-files-found: ignore
