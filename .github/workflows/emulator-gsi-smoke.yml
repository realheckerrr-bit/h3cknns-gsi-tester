name: Android Emulator GSI boot smoke test

on:
  workflow_dispatch:
    inputs:
      system_source:
        description: "System image to boot against the Ranchu guest"
        required: true
        default: gsi
        type: choice
        options:
          - gsi
          - stock
      gsi_url:
        description: "Official ARM64 GSI ZIP URL"
        required: true
        default: https://dl.google.com/developers/android/cinnamonbun/images/gsi/aosp_arm64-exp-CP41.260831.007-16416850-5e61c946.zip
      gsi_sha256:
        description: "SHA-256 for the GSI ZIP (empty disables the check)"
        required: false
        default: 5e61c946ee45680365336968827bf62509d90f66ed78938f88e4deedda40a7fe

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ARM QEMU and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential cpio e2fsprogs flex \
            gettext libfdt-dev libglib2.0-dev libpixman-1-dev libslirp-dev \
            gdb libtool lz4 libsdl2-dev ninja-build pkg-config python3 \
            imagemagick rsync socat unzip x11-xserver-utils xvfb xz-utils

      - name: Fetch current Android Ranchu QEMU source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git -c http.version=HTTP/1.1 clone --depth 1 --branch emu-35-3-release \
              https://android.googlesource.com/platform/external/qemu qemu; then
              break
            fi
            rm -rf qemu
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 8
          done
          git -C qemu config submodule.dtc.url https://github.com/qemu/dtc.git
          git -C qemu config submodule.capstone.url https://github.com/capstone-engine/capstone.git
          git -C qemu config submodule.ui/keycodemapdb.url https://gitlab.com/qemu-project/keycodemapdb.git
          git -C qemu submodule update --init --depth 1 capstone dtc ui/keycodemapdb
          printf '%s\n' "$(git -C qemu describe --always)" > qemu/VERSION
          for attempt in 1 2 3; do
            if git -c http.version=HTTP/1.1 clone --depth 1 \
              https://android.googlesource.com/platform/hardware/google/aemu /tmp/aemu-source; then
              break
            fi
            rm -rf /tmp/aemu-source
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 8
          done
          mkdir -p qemu/android/android-emu/host-common
          cp /tmp/aemu-source/host-common/include/host-common/goldfish_pipe.h \
            /tmp/aemu-source/host-common/include/host-common/android_pipe_base.h \
            qemu/android/android-emu/host-common/
          python3 tools/patch_standalone_goldfish_pipe.py qemu/hw/misc/goldfish_pipe.c

      - name: Build current standalone Ranchu QEMU
        shell: bash
        run: |
          set -euo pipefail
          cd qemu
          sed -i 's/if (!default_net && !feature_is_enabled(kFeature_WiFiPacketStream)) {/if (!default_net) {/' vl.c
          sed -i '/MallocHook_SetMmapReplacement/d; /MallocHook_SetMunmapReplacement/d' util/mmap-alloc.c
          sed -i \
            -e 's/sys.version_info < (2,4) or sys.version_info >= (3,)/sys.version_info < (2,4)/' \
            -e 's/sys.version_info < (2,6) or sys.version_info >= (3,)/sys.version_info < (2,6)/' \
            configure
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-werror \
            --enable-sdl \
            --disable-gtk \
            --disable-vnc \
            --disable-curses \
            --disable-slirp \
            --disable-docs \
            --disable-user \
            --audio-drv-list=sdl \
            --enable-trace-backends=nop
          make -f Makefile -j"$(nproc)"
          test -x aarch64-softmmu/qemu-system-aarch64
          machines=$(aarch64-softmmu/qemu-system-aarch64 -machine help 2>&1 || true)
          printf '%s\n' "$machines"
          grep -E '^ranchu ' <<< "$machines"

      - name: Download official ARM64 Emulator guest pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p guest
          curl --fail --location --retry 3 --retry-delay 3 \
            -o guest/emulator.zip \
            https://dl.google.com/android/repository/sys-img/google_apis/arm64-v8a-35_r08.zip
          entries=$(unzip -Z1 guest/emulator.zip)
          printf '%s\n' "$entries" | grep -E '(kernel-ranchu|ramdisk\.img|vendor\.img|userdata\.img|encryptionkey\.img)' || true
          for asset in kernel-ranchu ramdisk.img; do
            entry=$(printf '%s\n' "$entries" | grep -E "(^|/)$asset$" | head -1 || true)
            [[ -n "$entry" ]]
            unzip -p guest/emulator.zip "$entry" > "guest/$asset"
            test -s "guest/$asset"
          done
          if gzip -t guest/kernel-ranchu 2>/dev/null; then
            gzip -dc guest/kernel-ranchu > guest/kernel-ranchu.raw
          else
            cp guest/kernel-ranchu guest/kernel-ranchu.raw
          fi
          test -s guest/kernel-ranchu.raw
          vendor_gz_entry=$(printf '%s\n' "$entries" | grep -E '(^|/)vendor\.img\.gz$' | head -1 || true)
          vendor_raw_entry=$(printf '%s\n' "$entries" | grep -E '(^|/)vendor\.img$' | head -1 || true)
          if [[ -n "$vendor_gz_entry" ]]; then
            unzip -p guest/emulator.zip "$vendor_gz_entry" | gzip -dc > guest/vendor.img
          else
            [[ -n "$vendor_raw_entry" ]]
            unzip -p guest/emulator.zip "$vendor_raw_entry" > guest/vendor.img
          fi
          test -s guest/vendor.img
          encryption_entry=$(printf '%s\n' "$entries" | grep -E '(^|/)encryptionkey\.img$' | head -1 || true)
          if [[ -n "$encryption_entry" ]]; then
            unzip -p guest/emulator.zip "$encryption_entry" > guest/encryptionkey.img
            test -s guest/encryptionkey.img
          fi
          userdata_entry=$(printf '%s\n' "$entries" | grep -E '(^|/)userdata\.img$' | head -1 || true)
          if [[ -n "$userdata_entry" ]]; then
            unzip -p guest/emulator.zip "$userdata_entry" > guest/userdata.img
            test -s guest/userdata.img
          else
            truncate -s 2G guest/userdata.img
            mkfs.ext4 -F -L userdata guest/userdata.img >/dev/null
          fi
          test -s guest/userdata.img

      - name: Download and verify official Android 17 ARM64 AOSP GSI
        if: inputs.system_source != 'stock'
        shell: bash
        env:
          GSI_URL: ${{ inputs.gsi_url }}
          GSI_SHA256: ${{ inputs.gsi_sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            -o guest/gsi.zip \
            "$GSI_URL"
          if [[ -n "$GSI_SHA256" ]]; then
            echo "$GSI_SHA256  guest/gsi.zip" | sha256sum --check --status
          fi
          system_entry=$(unzip -Z1 guest/gsi.zip | grep -E '(^|/)system\.img(\.gz)?$' | head -1)
          [[ -n "$system_entry" ]]
          if [[ "$system_entry" == *.gz ]]; then
            unzip -p guest/gsi.zip "$system_entry" | gzip -dc > guest/system.img
          else
            unzip -p guest/gsi.zip "$system_entry" > guest/system.img
          fi
          test -s guest/system.img

      - name: Extract stock Android Emulator system image
        if: inputs.system_source == 'stock'
        shell: bash
        run: |
          set -euo pipefail
          entries=$(unzip -Z1 guest/emulator.zip)
          system_entry=$(printf '%s\n' "$entries" | grep -E '(^|/)system\.img$' | head -1)
          [[ -n "$system_entry" ]]
          unzip -p guest/emulator.zip "$system_entry" > guest/system.img
          test -s guest/system.img

      - name: Adapt Ranchu vendor fstab for direct GSI system and vendor disks
        run: |
          python3 tools/patch_ranchu_vendor.py guest/vendor.img
          python3 tools/patch_ranchu_vendor.py guest/system.img
          python3 tools/patch_ranchu_ramdisk.py guest/ramdisk.img guest/ramdisk.patched.img
          dd if=guest/vendor.img of=guest/vendor.raw.img bs=512 skip=2048 count=212992 status=none
          test "$(stat -c%s guest/vendor.raw.img)" -eq 109051904
          lz4 -t guest/ramdisk.patched.img || true
          lz4 -d -f guest/ramdisk.patched.img guest/ramdisk.raw || true
          echo '--- patched ramdisk entries ---'
          cpio -itv < guest/ramdisk.raw 2>&1 | grep -E '(^|/)(lib|lib/modules|virtio_|init|fstab)' | head -100 || true
          echo '--- vendor strings containing fstab or partition mounts ---'
          strings -a guest/vendor.img | grep -Ei 'fstab|/metadata|/system .*logical|/vendor .*logical' | head -100 || true
          for fstab in fstab.ranchu fstab.ranchu.initrd fstab.emulator fstab.goldfish; do
            if debugfs -R "cat etc/$fstab" guest/vendor.img > "guest/$fstab" 2>/dev/null; then
              echo "--- etc/$fstab ---"
              sed -n '1,120p' "guest/$fstab"
            fi
          done
          echo '--- vendor filesystem root ---'
          fdisk -l guest/vendor.img 2>&1 | head -80 || true
          debugfs -R 'ls -p /' guest/vendor.img 2>&1 | head -80 || true
          echo '--- vendor etc listing ---'
          debugfs -R 'ls -p /etc' guest/vendor.img 2>&1 | head -120 || true

      - name: Run current Ranchu QEMU directly with the patched GSI
        shell: bash
        run: |
          set -uo pipefail
          qemu_bin="$PWD/qemu/aarch64-softmmu/qemu-system-aarch64"
          test -x "$qemu_bin"
          booted=0
          emulator_pid=0
          xvfb_pid=0
          xvfb_display_file="$RUNNER_TEMP/gsi-tester-xvfb.display"
          xvfb_log="$RUNNER_TEMP/gsi-tester-xvfb.log"
          rm -f "$xvfb_display_file" "$xvfb_log"
          Xvfb -displayfd 9 -screen 0 1080x1920x24 -ac \
            >"$xvfb_log" 2>&1 9>"$xvfb_display_file" &
          xvfb_pid=$!
          for _ in $(seq 1 20); do
            if [[ -s "$xvfb_display_file" ]]; then break; fi
            sleep 1
          done
          if [[ ! -s "$xvfb_display_file" ]]; then
            cat "$xvfb_log" >&2 || true
            exit 1
          fi
          export DISPLAY=":$(tr -d '\n' < "$xvfb_display_file")"
          stop_emulator() {
            if [[ "$emulator_pid" == 0 ]]; then return; fi
            if kill -0 "$emulator_pid" 2>/dev/null; then
              # Keep retries from inheriting a QEMU process that still owns userdata.img.
              kill -TERM -- "-$emulator_pid" 2>/dev/null || true
              kill -TERM "$emulator_pid" 2>/dev/null || true
              for _ in $(seq 1 10); do
                if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
                sleep 1
              done
              kill -KILL -- "-$emulator_pid" 2>/dev/null || true
              kill -KILL "$emulator_pid" 2>/dev/null || true
            fi
            wait "$emulator_pid" 2>/dev/null || true
            emulator_pid=0
          }
          stop_xvfb() {
            if [[ "$xvfb_pid" != 0 ]] && kill -0 "$xvfb_pid" 2>/dev/null; then
              kill "$xvfb_pid" 2>/dev/null || true
              wait "$xvfb_pid" 2>/dev/null || true
            fi
            xvfb_pid=0
          }
          for attempt in 1 2; do
            rm -f serial.log qemu.stdout qemu.stderr
            # Exercise the same SDL display mode that the APK opens in
            # GsiSDLActivity, with a real Xvfb surface for framebuffer capture.
            setsid --wait "$qemu_bin" \
            -accel tcg,thread=multi \
            -M ranchu \
            -cpu cortex-a57 \
            -m 4096 \
            -smp 2 \
            -rtc base=utc \
            -kernel "$PWD/guest/kernel-ranchu.raw" \
            -initrd "$PWD/guest/ramdisk.patched.img" \
            -append 'console=ttyAMA0,115200 androidboot.console=ttyAMA1 androidboot.hardware=ranchu androidboot.verifiedbootstate=orange androidboot.qemu=1 androidboot.qemu.vsync=60 qemu.gles=1 androidboot.hardware.egl=emulation androidboot.hardware.gralloc=ranchu androidboot.hardware.hwcomposer=ranchu androidboot.opengles.version=196609 androidboot.debug.hwui.renderer=opengl androidboot.debug.renderengine.backend=skiagl androidboot.config.low_ram=0 androidboot.dalvik.vm.checkjni=1 androidboot.debug.stagefright.ccodec=4 androidboot.debug.sf.nobootanimation=1 qemu.logcat=start androidboot.selinux=permissive selinux=0 security=selinux enforcing=0 androidboot.dalvik.vm.heapsize=192m' \
            -drive if=none,format=raw,id=userdata,file="$PWD/guest/userdata.img" \
            -device virtio-blk-device,drive=userdata \
            -drive if=none,format=raw,id=system,file="$PWD/guest/system.img",readonly=on \
            -device virtio-blk-device,drive=system \
            -drive if=none,format=raw,id=vendor,file="$PWD/guest/vendor.raw.img",readonly=on \
            -device virtio-blk-device,drive=vendor \
            -device virtio-gpu-device,id=gpu0,xres=1080,yres=1920 \
            -display sdl \
            -monitor none \
            -serial file:serial.log \
            -no-reboot \
            > qemu.stdout 2> qemu.stderr &
            emulator_pid=$!
            for _ in $(seq 1 300); do
            if grep -Eiq 'sys\.boot_completed|boot animation stopped|starting service .zygote|Android runtime started|class_start main.*succeeded' serial.log 2>/dev/null; then
              booted=1
              # class_start main can precede SurfaceFlinger's first frame.
              # Keep the guest alive long enough to verify the SDL framebuffer,
              # not just the serial boot milestone.
              sleep 30
              import -window root -silent display.png 2>/dev/null || true
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              break
            fi
            sleep 1
            done
            if [[ "$booted" == 1 ]]; then
              break
            fi
            stop_emulator
            echo "Ranchu attempt $attempt did not reach an Android marker; retrying cold." >&2
          done
          stop_emulator
          stop_xvfb
          cp "$xvfb_log" xvfb.log 2>/dev/null || true
          tail -300 serial.log 2>/dev/null || true
          cat qemu.stdout 2>/dev/null || true
          cat qemu.stderr 2>/dev/null || true
          if [[ "$booted" != 1 ]]; then
            echo 'No Android boot marker was observed from current Ranchu QEMU.' >&2
            exit 1
          fi

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-gsi-boot-logs
          path: |
            serial.log
            qemu.stdout
            qemu.stderr
            display.png
            xvfb.log
          if-no-files-found: ignore
