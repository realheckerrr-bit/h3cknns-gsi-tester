name: Build h3cknn's GSI tester APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools cmake;3.22.1

      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          for attempt in 1 2 3; do
            rm -rf "$sdk_root/ndk/27.2.12479018"
            if yes | sdkmanager --install "ndk;27.2.12479018"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 10
          done
          test -x "$sdk_root/ndk/27.2.12479018/ndk-build"

      - name: Fetch latest successful Ranchu QEMU engine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          run_id="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/actions/workflows/build-android-qemu-engine.yml/runs?status=success&per_page=1" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["workflow_runs"][0]["id"])')"
          artifact_id="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/actions/runs/${run_id}/artifacts" |
            python3 -c 'import json,sys; print(next(a["id"] for a in json.load(sys.stdin)["artifacts"] if a["name"]=="android-ranchu-qemu-engine"))')"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/ranchu-engine.zip \
            "${api}/actions/artifacts/${artifact_id}/zip"
          unzip -j -o /tmp/ranchu-engine.zip '*.so' -d app/src/main/jniLibs/arm64-v8a
          test -s app/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so
          # These shared libraries are copied into the APK's arm64-v8a
          # native-library directory below. The app must be self-contained;
          # users must not install a second QEMU engine package.
          for library in \
            libqemu-system-aarch64.so \
            libSDL2.so \
            libcompat-SDL2-ext.so \
            libcompat-limbo.so \
            libcompat-musl.so \
            libglib-2.0.so \
            liblimbo.so \
            libpixman-1.so \
            libc++_shared.so \
            libgfxstream_backend.so; do
            test -s "app/src/main/jniLibs/arm64-v8a/$library" || {
              echo "Missing engine dependency: $library" >&2
              exit 1
            }
          done

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace testDebugUnitTest
          gradle --no-daemon --stacktrace assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libqemu-system-aarch64.so'
          for library in \
            libqemu-system-aarch64.so \
            libSDL2.so \
            libcompat-SDL2-ext.so \
            libcompat-limbo.so \
            libcompat-musl.so \
            libglib-2.0.so \
            liblimbo.so \
            libpixman-1.so \
            libc++_shared.so \
            libgfxstream_backend.so; do
            unzip -l "$apk" | grep -F "lib/arm64-v8a/$library"
          done

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3cknns-gsi-tester-test-reports
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: h3cknns-gsi-tester-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
