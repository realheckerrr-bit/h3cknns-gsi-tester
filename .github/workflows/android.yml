name: Build h3cknn's GSI tester APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;27.2.12479018 cmake;3.22.1

      - name: Fetch pinned ARM64 QEMU runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 \
            -o /tmp/limbo-qemu.apk \
            https://github.com/limboemu/limbo/releases/download/v6.0.1-LimboEmulator/limbo-android-arm-6.0.1-qemu-5.1.0.apk
          unzip -j -o /tmp/limbo-qemu.apk 'lib/arm64-v8a/*.so' -d app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets
          unzip -p /tmp/limbo-qemu.apk assets/roms/efi-virtio.rom > app/src/main/assets/efi-virtio.rom
          test -s app/src/main/assets/efi-virtio.rom
          rm -f app/src/main/jniLibs/arm64-v8a/liblimbo.so

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace testDebugUnitTest
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3cknns-gsi-tester-test-reports
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: h3cknns-gsi-tester-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
